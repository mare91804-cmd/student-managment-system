
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic-Tac-Toe Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header>
      <h1>🎮 Tic-Tac-Toe</h1>
      <p>Think • Play • Win</p>
    </header>

    <section class="scoreboard">
      <div class="score x-score">
        <span>Player X</span>
        <strong id="scoreX">0</strong>
      </div>
      <div class="score">
        <span>Draws</span>
        <strong id="scoreDraw">0</strong>
      </div>
      <div class="score o-score">
        <span>Player O</span>
        <strong id="scoreO">0</strong>
      </div>
    </section>

    <div class="board" id="board">
      <button class="cell" data-index="0" aria-label="Cell 1"></button>
      <button class="cell" data-index="1" aria-label="Cell 2"></button>
      <button class="cell" data-index="2" aria-label="Cell 3"></button>
      <button class="cell" data-index="3" aria-label="Cell 4"></button>
      <button class="cell" data-index="4" aria-label="Cell 5"></button>
      <button class="cell" data-index="5" aria-label="Cell 6"></button>
      <button class="cell" data-index="6" aria-label="Cell 7"></button>
      <button class="cell" data-index="7" aria-label="Cell 8"></button>
      <button class="cell" data-index="8" aria-label="Cell 9"></button>
    </div>

    <h2 id="status" aria-live="polite">Player X's turn</h2>

    <div class="actions">
      <button id="newGame" class="primary">New Game</button>
      <button id="resetScores" class="secondary">Reset Scores</button>
      <button id="howToPlay" class="secondary">How to Play</button>
    </div>

    <p id="instructions" hidden>
      Players take turns placing X and O. The first player to make
      three symbols in a row, column, or diagonal wins. If all nine
      cells are filled without a winner, the game is a draw.
    </p>

    <footer>Built with HTML, CSS and JavaScript</footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
